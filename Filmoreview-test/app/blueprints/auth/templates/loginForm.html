<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/form.css">
    <title>Login</title>
</head>
<body>
    <header>
            <nav>
                <div class="logo">
                    <h2><a href="../../homepage/templates/homepage.html">Filmoreview</a></h2>
                </div>
            </nav>
        </header>
    <main>
        <div class="content">
            <h1>Que bom ter você de volta!</h1>
            <h2>Dê notas, escreva reviews, monte suas listas e descubra o que os outros cinéfilos estão assistindo.</h2>
        </div>
        <form class="formulario">
        <br>
        <h1>Faça o seu login</h1>
        <h5>Preencha os campos abaixo efetivar o login.</h5>
        <br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>
        
        <label for="senha">Senha:</label>
        <input type="password" id="senha" required>

        <button type="submit">Login</button>
        <p>Não possui uma conta? <a href="cadastroForm.html">Criar conta</a></p>
        </form>
    </main>
</body>
</html>
