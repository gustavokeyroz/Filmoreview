<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/form.css">
    <title>Cadastro</title>
</head>
<body>
    <header>
            <nav>
                <div class="logo">
                    <h2><a href="../../homepage/templates/homepage.html">Filmoreview</a></h2>
                </div>
            </nav>
        </header>
    <main>
        <div class="content">
            <h1>Crie sua conta e comece a avaliar filmes.</h1>
            <h2>Dê notas, escreva reviews, monte suas listas e descubra o que os outros cinéfilos estão assistindo.</h2>
        </div>
        <form class="formulario">
        <br>
        <h1>Crie sua conta</h1>
        <h5>Preencha os campos abaixo para criar sua conta.</h5>
        <br>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" required>

        <label for="nome-usuario">Nome de usuário:</label>
        <input type="text" id="nome-usuario" required>

        <label for="data-nascimento">Data de Nascimento:</label>
        <input type="date" id="data-nascimento" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>
        
        <label for="senha">Senha:</label>
        <input type="password" id="senha" required>
        <p>Senha deve conter pelo menos 8 caracteres.</p>

        <label for="confirmar-senha">Confirmar Senha:</label>
        <input type="password" id="confirmar-senha" required>

        <button type="submit">Criar conta</button>
        <p>Já possui uma conta? <a href="loginForm.html">Faça login</a></p>
        </form>
    </main>


    <script>
        const hoje = new Date();
        const hojeFormatado = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0') + '-' + String(hoje.getDate()).padStart(2, '0');

        document.getElementById('data-nascimento').max = hojeFormatado;

        const anoMinimo = hoje.getFullYear() - 120;
        document.getElementById('data-nascimento').min = `${anoMinimo}-01-01`;
    </script>
</body>
</html>
